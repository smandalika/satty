# Programs built specifically for first- and second-year students.
#
# These almost never show up in the scraped feeds: they open on their own
# calendar, often months before regular internship season, and the aggregators
# don't track them. They are also the single highest-yield thing a sophomore
# can apply to, because you aren't competing with rising seniors.
#
# `opens` / `closes` are the months the window has historically fallen in and
# WILL drift year to year. Treat them as "start checking", not as fact — the
# linked page is always the truth. Fix anything you find stale; this is just
# a data file.

programs:
  - company: Google
    program: STEP (Student Training in Engineering Program)
    url: https://buildyourfuture.withgoogle.com/programs/step
    eligibility: First- and second-year undergraduates
    opens: 9
    closes: 11
    note: The flagship sophomore SWE internship. Apply the week it opens.

  - company: Microsoft
    program: Explore Program
    url: https://careers.microsoft.com/students
    eligibility: First- and second-year undergraduates
    opens: 9
    closes: 12
    note: Rotates you through SWE, PM and design over one summer.

  - company: Meta
    program: Meta University
    url: https://www.metacareers.com/careerprograms/students
    eligibility: Rising sophomores and juniors
    opens: 10
    closes: 1
